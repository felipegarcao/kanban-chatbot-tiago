# painel.felipesystem.com.br — proxy reverso pro kanban-chatbot.
# O container sobe via docker-compose e expõe a porta 3000 só em 127.0.0.1 (ver
# docker-compose.yml na raiz do projeto) — o Nginx é a única porta de entrada externa.
#
# Como aplicar na VPS:
#   sudo cp deploy/nginx/painel.felipesystem.com.br.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/painel.felipesystem.com.br.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d painel.felipesystem.com.br
#
# O Certbot edita este mesmo arquivo pra adicionar o bloco HTTPS (443) e o redirect
# automático de HTTP pra HTTPS — não precisa escrever o bloco 443 na mão.

server {
    listen 80;
    listen [::]:80;
    server_name painel.felipesystem.com.br;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # essencial pro rate limiter de login (src/presentation/http/rateLimiter.ts)
        # identificar o IP real do cliente em vez do IP do proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # o App Router faz streaming (Suspense) — buffer ligado atrasa a resposta
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
